name: Unzip project

# ارفع ملف zip واحد (مثلاً project.zip) إلى جذر المستودع، وسيقوم هذا الـ workflow
# بفك الضغط ووضع الملفات في المستودع ثم حذف ملف الـ zip.

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN لا يستطيع دفع ملفات داخل .github/workflows.
          # إذا كان الـ zip يحتوي workflows أضف سراً باسم PUSH_TOKEN (PAT بصلاحية repo + workflow).
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - name: Extract zip files into the repo root
        run: |
          set -e
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No .zip file in the repo root; nothing to do."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "== Extracting $z"
            tmp=$(mktemp -d)
            unzip -q "$z" -d "$tmp"
            # If the zip has a single top-level folder, use its contents as the root.
            entries=("$tmp"/* "$tmp"/.[!.]*)
            src="$tmp"
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            fi
            rm -rf "$src/.git"
            cp -a "$src"/. ./
            # never let the zip overwrite this workflow itself
            git checkout -- .github/workflows/unzip.yml 2>/dev/null || true
            git rm -q -f -- "$z"
            rm -rf "$tmp"
          done

      - name: Commit and push
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Unzip uploaded project"
          git push
